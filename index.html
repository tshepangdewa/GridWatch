<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GridWatch — Bulawayo</title>

    <!-- MapLibre -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@^6.8.0/dist/maplibre-gl.css"
    >

    <!-- GridWatch styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="map"></div>

    <div class="brand">
        <div class="brand-name">GRIDWATCH</div>
        <div class="brand-location">BULAWAYO</div>
    </div>

    

    <div class="status-legend">

        <div class="legend-title">
            STATUS
        </div>

        <div class="legend-item">
            <span class="legend-dot legend-on"></span>
            <span>ON</span>
        </div>

        <div class="legend-item">
            <span class="legend-dot legend-off"></span>
            <span>OFF</span>
        </div>

    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
